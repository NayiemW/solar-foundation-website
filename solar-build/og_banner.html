<!DOCTYPE html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Manrope:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;padding:0;width:1200px;height:630px;overflow:hidden;background:#0a0a0d;font-family:'Manrope',sans-serif;}
  .wrap{position:relative;width:1200px;height:630px;padding:72px 80px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:space-between;}
  .glow{position:absolute;right:-120px;top:-120px;width:620px;height:620px;border-radius:50%;background:radial-gradient(circle,rgba(255,140,90,.22),rgba(255,140,90,0) 62%);pointer-events:none;}
  .glow2{position:absolute;left:-160px;bottom:-200px;width:560px;height:560px;border-radius:50%;background:radial-gradient(circle,rgba(246,166,35,.10),rgba(246,166,35,0) 60%);pointer-events:none;}
  .top{display:flex;align-items:center;gap:16px;position:relative;}
  .top img{width:46px;height:46px;border-radius:11px;}
  .brand{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:30px;color:#f4f3f6;letter-spacing:-.01em;}
  .tag{font-family:'JetBrains Mono',monospace;font-size:14px;color:#8b8a93;border:1px solid #2a2930;border-radius:6px;padding:5px 11px;letter-spacing:.12em;}
  .chip{margin-left:auto;display:inline-flex;align-items:center;gap:9px;background:rgba(246,166,35,.09);border:1px solid rgba(246,166,35,.3);border-radius:999px;padding:8px 16px;}
  .chip i{width:9px;height:9px;border-radius:50%;background:#f6a623;display:inline-block;}
  .chip span{font-family:'JetBrains Mono',monospace;font-size:14px;color:#f6a623;letter-spacing:.02em;}
  h1{position:relative;font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:72px;line-height:1.04;letter-spacing:-.03em;color:#f4f3f6;margin:0;max-width:1000px;}
  h1 .g{background:linear-gradient(135deg,#ffc24a,#ff6a5e);-webkit-background-clip:text;background-clip:text;color:transparent;}
  .sub{position:relative;font-size:25px;line-height:1.5;color:#a9a8b0;margin:24px 0 0;max-width:900px;}
  .foot{display:flex;align-items:center;gap:22px;position:relative;}
  .foot .url{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:24px;color:#f4f3f6;}
  .pills{display:flex;gap:10px;flex-wrap:wrap;}
  .pill{font-family:'JetBrains Mono',monospace;font-size:15px;color:#bcbbc4;border:1px solid #232228;background:#0e0d12;border-radius:8px;padding:8px 14px;}
</style></head>
<body>
  <div class="wrap">
    <div class="glow"></div><div class="glow2"></div>
    <div class="top">
      <img src="https://storage.ghost.io/c/32/25/3225f39c-c8f7-41ca-b74e-7db2f5ea653a/content/images/size/w256h256/2025/03/favicon.png" alt="">
      <span class="brand">Solar</span>
      <span class="tag">FOUNDATION</span>
      <span class="chip"><i></i><span>Maintenance-only</span></span>
    </div>
    <div>
      <h1>The transparent record of <span class="g">Solar (SXP).</span></h1>
      <p class="sub">The full history, the Binance Token Swap Agreement, why Core 5.0 was blocked, and 82 screenshot exhibits — published in full.</p>
    </div>
    <div class="foot">
      <span class="url">solar.org</span>
      <div class="pills"><span class="pill">History</span><span class="pill">Core 5.0</span><span class="pill">The agreement</span><span class="pill">82 exhibits</span><span class="pill">FAQ</span></div>
    </div>
  </div>
</body></html>
